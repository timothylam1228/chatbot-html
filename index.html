<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <title>HKU Genie</title>

<style>
  :root {
    --chat-edge-gap: clamp(8px, 2vw, 24px);
    --chat-button-size: clamp(52px, 7vw, 72px);
    --chat-button-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    --chat-gap-between-button-window: 12px;

    --chat-window-bottom: calc(
      var(--chat-button-bottom)
      + var(--chat-button-size)
      + var(--chat-gap-between-button-window)
    );
  }

#fastgpt-chatbot-window {
  box-sizing: border-box !important;

  right: var(--chat-edge-gap) !important;
  bottom: var(--chat-window-bottom) !important;

  width: min(550px, calc(100dvw - (var(--chat-edge-gap) * 2))) !important;

  /* Default desktop/tablet height */
  height: min(
    680px,
    calc(75dvh - var(--chat-window-bottom))
  ) !important;

  max-width: none !important;
  max-height: none !important;
  overflow: hidden !important;
}

/* Large desktop */
@media screen and (min-width: 1280px) {
  #fastgpt-chatbot-window {
    width: 520px !important;
    height: min(640px, 70dvh) !important;
  }
}

/* Normal laptop / tablet */
@media screen and (max-width: 1023px) {
  #fastgpt-chatbot-window {
    width: min(440px, calc(100dvw - (var(--chat-edge-gap) * 2))) !important;
    height: min(
      620px,
      calc(100dvh - var(--chat-window-bottom) - var(--chat-edge-gap))
    ) !important;
  }
}

/* Mobile full width */
@media screen and (max-width: 480px) {
  :root {
    --chat-edge-gap: 0px;
    --chat-button-size: 56px;
    --chat-button-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    --chat-gap-between-button-window: 8px;

    --chat-window-bottom: calc(
      var(--chat-button-bottom)
      + var(--chat-button-size)
      + var(--chat-gap-between-button-window)
    );
  }

  #fastgpt-chatbot-button {
    width: var(--chat-button-size) !important;
    height: var(--chat-button-size) !important;
    right: 12px !important;
    bottom: var(--chat-button-bottom) !important;
  }

  #fastgpt-chatbot-window {
    left: 0 !important;
    right: 0 !important;
    bottom: var(--chat-window-bottom) !important;

    width: 100dvw !important;
    min-width: 100dvw !important;
    max-width: 100dvw !important;

    height: calc(100dvh - var(--chat-window-bottom)) !important;
    max-height: none !important;

    border-radius: 0 !important;
  }
}

/* Very short screens / landscape */
@media screen and (max-height: 520px) {
  #fastgpt-chatbot-window {
    height: calc(100dvh - var(--chat-window-bottom) - 8px) !important;
  }
}
</style>
